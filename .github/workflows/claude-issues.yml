name: Claude Issues

# Comunicación Issue -> Claude. Solo responde con comentarios en la Issue:
# lectura de PRs, CI y git, sin escritura de código, ramas ni PRs. Solo se
# activa si el comentario lo escribe Sevillanof en una Issue (no en PRs) e
# incluye @claude.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: claude-issues-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login == 'Sevillanof' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Traer las ramas de las PR (solo lectura)
        run: git fetch origin '+refs/pull/*/head:refs/remotes/pr/*'
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 25
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh run view:*),Bash(gh run list:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git branch:*),Bash(git ls-remote:*)"
