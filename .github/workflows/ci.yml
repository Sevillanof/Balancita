name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.0'
  PNPM_VERSION: '10.28.0'
  PYTHON_VERSION: '3.12'

jobs:
  # Frontend: fast checks (no network services, no databases).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # Formatting. Requires the formatting-only PR to be merged first.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # Server: typecheck and Vitest. Uses temporary SQLite files only.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile
      - run: pnpm typecheck:server
      - run: pnpm test:server
  # Python engine, split in three parallel groups (BAL-DECISION-197-01). Every
  # test still runs: a module belongs to `integration` or `session` when listed
  # there, otherwise to `rest`, so a new module is never left out. Each group
  # records the ids of the tests it loads and checks that unittest ran exactly
  # that many; the `python` job below compares the union against a full
  # `discover -s python/tests` and fails on any missing or duplicated test.
  python-tests:
    name: python (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [integration, session, rest]
    env:
      GROUP: ${{ matrix.group }}
      PYTHONPATH: python:python/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Select the modules of this group
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, unittest

          # Explicit groups. Everything else goes to `rest`. The session
          # modules may not exist yet on a given branch: then that group is empty.
          GROUPS = {
              "integration": ["test_paper_live_integration"],
              "session": ["test_paper_safe_stop_186_session", "test_paper_stop_session_186"],
          }
          group = os.environ["GROUP"]
          on_disk = sorted(os.path.basename(p)[:-3] for p in glob.glob("python/tests/test*.py"))
          explicit = {m for ms in GROUPS.values() for m in ms}
          mods = [m for m in on_disk if m in GROUPS[group]] if group in GROUPS \
              else [m for m in on_disk if m not in explicit]
          ids = []
          def walk(suite):
              for t in suite:
                  walk(t) if isinstance(t, unittest.TestSuite) else ids.append(t.id())
          for m in mods:
              walk(unittest.defaultTestLoader.loadTestsFromName(m))
          bad = [i for i in ids if i.startswith("unittest.loader.")]
          if bad:
              raise SystemExit("modules that fail to import: %s" % bad)
          open("modules.txt", "w").write(" ".join(mods))
          open("ids-%s.txt" % group, "w").write("\n".join(sorted(ids)) + ("\n" if ids else ""))
          print("group %s: %d modules, %d tests" % (group, len(mods), len(ids)))
          print("\n".join(mods))
          PY
      - name: Run the tests of this group
        shell: bash
        run: |
          if [ -z "$(cat modules.txt)" ]; then
            echo "Group $GROUP has no modules on this branch; nothing to run."
            echo "Ran 0 tests" > run.log
          else
            python -m unittest $(cat modules.txt) 2>&1 | tee run.log
          fi
      - name: Check that unittest ran exactly the tests loaded
        shell: bash
        run: |
          ran=$(sed -n 's/^Ran \([0-9]*\) tests\? in .*/\1/p' run.log | tail -1)
          [ "$ran" = "" ] && [ "$(cat modules.txt)" = "" ] && ran=0
          expected=$(grep -c . "ids-$GROUP.txt" || true)
          echo "group=$GROUP ran=$ran expected=$expected"
          [ "$ran" = "$expected" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-ids-${{ matrix.group }}
          path: ids-${{ matrix.group }}.txt
          retention-days: 7

  # Aggregate gate. Keeps the old check name `python`. It needs all three
  # groups green and the same test ids as one full discovery: same count,
  # same names, none lost and none run twice.
  python:
    needs: python-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: python
    steps:
      - name: All groups must have passed
        run: |
          [ "${{ needs.python-tests.result }}" = "success" ]
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: python-ids-*
          path: ids
          merge-multiple: true
      - name: Compare the groups with a full discovery
        shell: bash
        run: |
          python - <<'PY'
          import collections, glob, unittest

          def walk(suite, out):
              for t in suite:
                  walk(t, out) if isinstance(t, unittest.TestSuite) else out.append(t.id())

          full = []
          walk(unittest.defaultTestLoader.discover("python/tests"), full)
          grouped = []
          files = sorted(glob.glob("ids/ids-*.txt"))
          for f in files:
              ids = [l for l in open(f).read().splitlines() if l]
              print("%s: %d tests" % (f, len(ids)))
              grouped += ids
          print("groups total: %d; full discovery: %d" % (len(grouped), len(full)))
          problems = []
          if len(files) != 3:
              problems.append("expected 3 group files, found %d" % len(files))
          c_full, c_group = collections.Counter(full), collections.Counter(grouped)
          missing = sorted((c_full - c_group).elements())
          extra = sorted((c_group - c_full).elements())
          if missing:
              problems.append("%d tests in no group: %s" % (len(missing), missing[:20]))
          if extra:
              problems.append("%d tests duplicated or unknown: %s" % (len(extra), extra[:20]))
          if any("unittest.loader." in i for i in full):
              problems.append("a module fails to import")
          if problems:
              raise SystemExit("\n".join(problems))
          print("OK: the three groups run exactly the %d tests of the full discovery" % len(full))
          PY

  # End to end: Playwright with mocked network responses (see e2e/screens.pw.ts).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The integration spec starts the real gateway, which needs its deps.
      - run: pnpm --dir server install --frozen-lockfile
      # ... and the strategy registry S (Python) with a throwaway database.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
