# Drop-in de balancita.service que APAGA llama-server (Qwen) en la VPS (T19 de odd/tasks/noticias-y-auditor.md, S10).
# PREPARADO, SIN APLICAR. Se instala solo después de que `noticias.conf` (motor de reglas) lleve un rato catalogando bien.
# Se instala en /etc/systemd/system/balancita.service.d/sin-llama.conf (ver ops/vps/README.md, «Apagar llama-server»).
[Service]
# scripts/dev-provider-env.mjs (resolveLlamaServer): con DECISIONS_ENABLED=0 no hay comando de llama-server, así que no
# arrancan `llm` (llama-server), `q` (las decisiones viejas, del motor D retirado) ni `qwenexit` (C31, ya apagada por su
# bloque "off"). Siguen arrancando captura, gateway, noticias (reglas) y `qwenlive`, el trader de la Terminal: decide por
# fórmula (decide_by: formula, maestro + portero) con la opinión del modelo apagada (opinion_enabled: false), así que
# ninguna decisión pregunta al modelo. Probado en scripts/dev.node-test.mjs.
Environment=DECISIONS_ENABLED=0
