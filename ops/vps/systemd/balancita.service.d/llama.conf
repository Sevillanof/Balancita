# Drop-in de balancita.service para llama-server (Qwen en CPU, 6 vCPU y 12 GB sin GPU).
# T8 de odd/tasks/noticias-y-auditor.md, paso 2. Aplicado en el VPS el 2026-11-07.
# Se instala en /etc/systemd/system/balancita.service.d/llama.conf (ver ops/vps/README.md).
[Service]
# 5 de 6 hilos: deja un núcleo libre para la captura y el gateway. scripts/dev-provider-env.mjs
# (llamaThreads) lo pasa a llama-server como `-t 5`.
Environment=LLAMA_THREADS=5
# Este llama-server (build 11429) no tiene --mlock: usa --load-mode, que lee LLAMA_ARG_LOAD_MODE
# (LLAMA_ARG_MLOCK no existe y se ignoraba: VmLck quedó en 0). El lanzador le pasa el entorno entero.
# Fija los 4,2 GB del modelo en RAM. Verificar con `grep VmLck /proc/$(pgrep -x llama-server)/status`.
Environment=LLAMA_ARG_LOAD_MODE=mmap+mlock
# Sin este límite el mlock falla (el servidor sigue sin él, pero no sirve de nada).
LimitMEMLOCK=infinity
