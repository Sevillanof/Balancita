# Drop-in de balancita.service para las noticias SIN IA (T18 de odd/tasks/noticias-y-auditor.md, S10).
# Se instala en /etc/systemd/system/balancita.service.d/noticias.conf (ver ops/vps/README.md, «Noticias sin IA»).
# El proceso de noticias (`futures_news`) hereda este entorno.
[Service]
# Motor de noticias: reglas fijas del backend (léxico en config/noticias-reglas.json), sin Qwen, sin Haiku, sin ningún
# modelo y sin llama-server. Cataloga cada noticia al entrar (tipo, dirección, importancia 0-3) en
# paper_futures_news_cards con card_version 3. Es el valor por defecto del código: esta línea solo lo deja explícito.
Environment=NEWS_ENGINE=reglas
#
# VOLVER A QWEN (deshacer): borrar este archivo o poner NEWS_ENGINE=qwen y descomentar las tres líneas que siguen, que son
# el modo solo-ficha de T14 (L17-L18 del mismo archivo ODD). Con NEWS_ENGINE=qwen hace falta llama-server encendido
# (sin sin-llama.conf).
#Environment=NEWS_CARDS=1
#Environment=NEWS_LEGACY_QUESTIONS=0
#Environment=NEWS_CARD_SCOPE=0
