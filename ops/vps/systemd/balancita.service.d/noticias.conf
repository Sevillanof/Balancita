# Drop-in de balancita.service para las noticias: modo solo-ficha (T14 de odd/tasks/noticias-y-auditor.md, S7).
# Autorizado por el usuario («Si, pasala a la VPS», L17). Se instala en
# /etc/systemd/system/balancita.service.d/noticias.conf (ver ops/vps/README.md, «Noticias: ficha de Qwen»).
# El proceso de noticias (`futures_news`) hereda este entorno; el lanzador ya le pasa --analyze con Qwen encendido.
[Service]
# La ficha de Qwen por noticia: tipo de evento, fuerza 0-3 y dirección, con reglas fijas encima.
Environment=NEWS_CARDS=1
# No preguntar las dos preguntas viejas (news_relevance_btc v2 y news_direction v2). Quienes las leían
# (resumen, API de noticias, informe de efecto) leen la ficha; priority_v2 queda sin datos (inerte), ver docs/medir-noticias.md.
Environment=NEWS_LEGACY_QUESTIONS=0
# No preguntar alcance / «ya pasó»: la ficha queda sin alcance y la regla del hackeo supone que ya pasó.
Environment=NEWS_CARD_SCOPE=0
