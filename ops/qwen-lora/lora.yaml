# Ajuste fino LoRA de Qwen3-4B con mlx-lm (hilo «Entrenar a Qwen con LoRA»). Los caminos (modelo, datos, adaptador) los pasa
# ops/qwen-lora/train.sh por línea de comandos; aquí van solo los hiperparámetros. Ver docs/qwen-lora.md.
train: true
fine_tune_type: lora
# LoRA en las últimas 16 capas (de 36): el gradiente no baja de la capa 20 y el paso cuesta ~40 % menos que con todas.
num_layers: 16
batch_size: 1
# Una pasada por los ~7.600 ejemplos de train.jsonl del dataset v3 (lote 1; dos por foto: real y espejo). Se puede cortar y
# retomar con --resume-adapter-file; train.sh train-measured mide cada 500 pasos y corta solo.
iters: 7600
learning_rate: 2.0e-5
steps_per_report: 50
steps_per_eval: 1000
# 20 lotes de validación (~35 s) en vez de 50 (92 s medidos): la validación es solo para mirar.
val_batches: 20
save_every: 500
# La ficha completa son ~1.000 tokens; 1.536 deja margen.
max_seq_length: 1536
# Solo se aprende la línea de respuesta: los tokens de la pregunta y del STATE no entran en la pérdida.
mask_prompt: true
# Medido en la Mac (26-oct, 30 pasos cada uno, con Qwen en vivo abierto): sin grad checkpointing 3,3 s/paso contra 3,8 con él (13 %
# más rápido) y la memoria alcanzó; lote 4 no mejora los ejemplos por segundo (0,31 contra 0,30), así que queda lote 1.
grad_checkpoint: false
seed: 20261026
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0
  keys:
    [
      'self_attn.q_proj',
      'self_attn.k_proj',
      'self_attn.v_proj',
      'self_attn.o_proj',
      'mlp.gate_proj',
      'mlp.up_proj',
      'mlp.down_proj',
    ]
